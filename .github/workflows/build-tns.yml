name: nspGL calculator build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale builds when another commit is pushed to the same branch.
concurrency:
  group: nspgl-tns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-check:
    name: Host build check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out nspGL
        uses: actions/checkout@v7

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pil libstb-dev fonts-dejavu-core

      - name: Build desktop test harness
        run: make host -j"$(nproc)" STB=/usr/include/stb

      - name: Smoke-test the sample page
        run: |
          NSPGL_FRAMES=3 ./build/nspgl-host samples/cube.html

  build-tns:
    name: Build nspgl.tns
    runs-on: ubuntu-22.04
    steps:
      - name: Check out nspGL
        uses: actions/checkout@v7
        with:
          path: nspgl

      - name: Check out Ndless SDK source
        uses: actions/checkout@v7
        with:
          repository: ndless-nspire/Ndless
          ref: r2020
          submodules: recursive
          fetch-depth: 0
          path: ndless

      - name: Install Ndless toolchain and nspGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            libboost-program-options-dev \
            libstb-dev \
            python3-pil \
            fonts-dejavu-core

      # Match DevonCraft's cached Ndless toolchain build so normal commits
      # do not rebuild the multi-stage ARM compiler from scratch.
      - name: Restore Ndless toolchain cache
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: |
            ndless/ndless-sdk/toolchain/install
            ndless/ndless-sdk/toolchain/.built_binutils
            ndless/ndless-sdk/toolchain/.built_gcc_step1
            ndless/ndless-sdk/toolchain/.built_newlib
            ndless/ndless-sdk/toolchain/.built_gcc_step2
            ndless/ndless-sdk/toolchain/.built_gdb
          key: ndless-toolchain-${{ runner.os }}-r2020-${{ hashFiles('ndless/ndless-sdk/toolchain/build_toolchain.sh') }}

      - name: Build Ndless ARM toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: ndless/ndless-sdk/toolchain
        run: PARALLEL="-j$(nproc)" ./build_toolchain.sh

      - name: Add Ndless tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless SDK
        working-directory: ndless
        run: make -j"$(nproc)"

      - name: Build nspGL calculator program
        working-directory: nspgl
        run: |
          make clean
          make -j"$(nproc)" STB=/usr/include/stb
          test -s nspgl.tns
          ls -lh nspgl.tns

      - name: Upload nspGL TNS file
        uses: actions/upload-artifact@v7
        with:
          name: nspgl-tns-${{ github.sha }}
          path: nspgl/nspgl.tns
          if-no-files-found: error
          retention-days: 30
